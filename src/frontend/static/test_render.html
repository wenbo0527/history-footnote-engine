<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Render Test</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
  .test-box {
    width: 600px;
    height: 400px;
    background: #fff;
    border: 2px solid #333;
    margin: 20px 0;
  }
  .label { font-size: 16px; margin: 8px 0; }
  .ok { color: green; font-weight: bold; }
  .err { color: red; font-weight: bold; }
</style>
</head>
<body>
<h1>🧪 渲染测试 - 万历江南地图</h1>
<div class="label">测试 1: 简单 HTML 元素（应该可见）</div>
<div class="test-box" style="background: lightblue;">如果看到这个蓝盒子 = HTML OK</div>

<div class="label">测试 2: 简单 SVG（应该可见）</div>
<div class="test-box" style="padding: 0;">
  <svg width="600" height="400" viewBox="0 0 600 400" style="background: lightyellow;">
    <rect x="50" y="50" width="500" height="300" fill="orange" stroke="red" stroke-width="4"/>
    <text x="300" y="200" text-anchor="middle" font-size="40" fill="white">SVG OK</text>
  </svg>
</div>

<div class="label">测试 3: SVG 渐变（fill="url(#g1)"）</div>
<div class="test-box" style="padding: 0;">
  <svg width="600" height="400" viewBox="0 0 600 400" style="background: lightgreen;">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="purple"/>
        <stop offset="100%" stop-color="cyan"/>
      </linearGradient>
    </defs>
    <rect x="50" y="50" width="500" height="300" fill="url(#g1)"/>
    <text x="300" y="200" text-anchor="middle" font-size="40" fill="white">渐变 OK</text>
  </svg>
</div>

<div class="label">测试 4: SVG filter (feTurbulence)</div>
<div class="test-box" style="padding: 0;">
  <svg width="600" height="400" viewBox="0 0 600 400" style="background: lightpink;">
    <defs>
      <filter id="t1" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="5"/>
      </filter>
    </defs>
    <rect x="50" y="50" width="500" height="300" filter="url(#t1)"/>
    <text x="300" y="200" text-anchor="middle" font-size="30" fill="white">Filter OK</text>
  </svg>
</div>

<div class="label">测试 5: SVG clip-path inset()</div>
<div class="test-box" style="padding: 0;">
  <svg width="600" height="400" viewBox="0 0 600 400" style="background: lavender;">
    <defs>
      <clipPath id="c1">
        <rect x="100" y="50" width="400" height="300"/>
      </clipPath>
    </defs>
    <rect x="50" y="50" width="500" height="300" fill="teal" clip-path="url(#c1)"/>
    <text x="300" y="200" text-anchor="middle" font-size="40" fill="white">clip-path OK</text>
  </svg>
</div>

<h2>如果上面 5 个测试都看到了 = 浏览器 SVG 渲染 OK</h2>
<h2>如果某些不可见 = preview tool 引擎对某特性不支持</h2>
</body>
</html>
